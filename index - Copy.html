function renderPalette(){const q=paletteInput.value.trim();const commands=NAV.map(n=>({type:'section',id:n.id,title:'Go to '+n.title,subtitle:'Section navigation',score:q?(n.title.toLowerCase().includes(q.toLowerCase())?500: -1):100}));const res=allRows().map(it=>({type:'entry',...it,title:it.row[0],subtitle:it.section.title+' · '+it.row[1],score:q?fuzzyScore(it,q):0})).filter(x=>q?x.score>=0:true);paletteMatches=[...commands.filter(x=>x.score>=0),...res].sort((a,b)=>b.score-a.score).slice(0,70);paletteIndex=Math.min(paletteIndex,Math.max(0,paletteMatches.length-1));clear(paletteResults);if(!paletteMatches.length){paletteResults.append(el('div','empty','No matching resources or sections.'));return;}paletteMatches.forEach((m,i)=>{const b=el('button','paletterow');b.type='button';b.setAttribute('role','option');b.setAttribute('aria-selected',String(i===paletteIndex));const txt=el('span','',m.title);const sub=el('small','',m.subtitle);txt.append(sub);b.append(txt,el('span','',m.type==='section'?'↵':'↗'));b.addEventListener('click',()=>selectPalette(i));paletteResults.append(b);});}
paletteInput.addEventListener('input',()=>{paletteIndex=0;renderPalette();});function selectPalette(i){const item=paletteMatches[i];if(!item)return;closePalette();if(item.type==='section')navigate(item.id);else navigate(item.sid);}
paletteInput.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();paletteIndex=(paletteIndex+1)%Math.max(1,paletteMatches.length);renderPalette();paletteResults.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest'});}else if(e.key==='ArrowUp'){e.preventDefault();paletteIndex=(paletteIndex-1+paletteMatches.length)%Math.max(1,paletteMatches.length);renderPalette();paletteResults.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest'});}else if(e.key==='Enter'){e.preventDefault();selectPalette(paletteIndex);}else if(e.key==='Escape'){e.preventDefault();closePalette();}});
paletteBack.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const focusables=[...paletteBack.querySelectorAll('input,button:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')].filter(n=>n.offsetParent!==null);if(!focusables.length){e.preventDefault();paletteInput.focus();return;}const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});paletteBack.addEventListener('click',e=>{if(e.target===paletteBack)closePalette();});
document.addEventListener('keydown',e=>{const target=e.target;const typing=target&&(target.matches('input,textarea,select')||target.isContentEditable);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();paletteBack.classList.contains('open')?closePalette():openPalette();return;}if(e.key==='/'&&!typing&&!paletteBack.classList.contains('open')){e.preventDefault();openPalette();return;}if(e.key==='Escape'&&paletteBack.classList.contains('open')){closePalette();return;}if(e.key==='?'&&!typing){toast('Shortcuts: Ctrl/Cmd K or / opens search · ↑/↓ navigates palette · Enter selects · Esc closes.');}if(!typing&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&target&&target.classList&&target.classList.contains('tab')){const list=[...tabsEl.querySelectorAll('.tab')],idx=list.indexOf(target),next=(idx+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;e.preventDefault();list[next].focus();navigate(list[next].dataset.route);}});
document.getElementById('randomBtn').addEventListener('click',()=>{const all=allRows();const it=all[Math.floor(Math.random()*all.length)];if(it)navigate(it.sid);});
backTop.addEventListener('click',()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));window.addEventListener('scroll',()=>backTop.classList.toggle('show',window.scrollY>600),{passive:true});window.addEventListener('hashchange',parseHash);
function fillFooter(){document.getElementById('footVersion').textContent='v'+DATA.meta.version;document.getElementById('footUpdated').textContent=DATA.meta.updated;document.getElementById('footCounts').textContent=totalEntries()+' entries · '+SECTION_IDS.length+' sections';document.getElementById('footOwner').textContent=DATA.meta.owner+' · '+DATA.meta.supportContact;}
function boot(){applyTheme();renderNav();fillFooter();if(location.hash)parseHash();else renderCurrent();}
boot();
})();
</script>
